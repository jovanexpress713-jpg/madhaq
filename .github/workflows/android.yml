name: MADHAQ Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Install Capacitor Android tooling
        run: bunx --bun npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Typecheck
        run: bun run lint

      - name: Business validation
        run: |
          bun run verify:production
          bun run verify:purchases
          bun run verify:returns
          bun run verify:supplier-payments

      - name: Build web application
        run: bun run build

      - name: Create Android project
        run: bunx cap add android

      - name: Sync web application into Android
        run: bunx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MADHAQ-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MADHAQ-Android
          path: MADHAQ-Android.apk
          if-no-files-found: error
          retention-days: 30
