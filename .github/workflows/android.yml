name: MADHAQ Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          java -version
          sdkmanager --version
          adb version
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Install Capacitor Android tooling
        run: bunx --bun npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets

      - name: Typecheck
        run: bun run lint

      - name: Business validation
        run: |
          bun run verify:production
          bun run verify:distribution-returns
          bun run verify:thursday-range
          bun run verify:purchases
          bun run verify:returns
          bun run verify:supplier-payments
          bun run verify:recipes
          bun run verify:recipe-production

      - name: Build web application
        run: bun run build

      - name: Create Android project
        run: bunx cap add android

      - name: Sync web application into Android
        run: bunx cap sync android

      - name: Generate branded MADHAQ launcher icon and native splash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          mkdir -p assets
          convert public/madhaq_logo.png -resize 900x900 -gravity center -background '#171411' -extent 1024x1024 assets/icon.png
          convert public/madhaq_logo.png -resize 900x900 -gravity center -background '#171411' -extent 2732x2732 assets/splash.png
          bunx capacitor-assets generate --android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MADHAQ-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MADHAQ-Android
          path: MADHAQ-Android.apk
          if-no-files-found: error
          retention-days: 30
