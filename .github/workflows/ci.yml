name: MADHAQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, business validation and production build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Production business-rule validation
        run: bun run verify:production

      - name: Distribution and return workflow validation
        run: bun run verify:distribution-returns

      - name: Thursday report week-range validation
        run: bun run verify:thursday-range

      - name: Purchase business-rule validation
        run: bun run verify:purchases

      - name: Return pricing business-rule validation
        run: bun run verify:returns

      - name: Customer return workflow validation
        run: bun run verify:customer-returns

      - name: Supply request to production workflow validation
        run: bun run verify:supply-production

      - name: Supplier payment business-rule validation
        run: bun run verify:supplier-payments

      - name: Full operational role workflow validation
        run: bun run verify:role-workflow

      - name: Recipe catalog validation
        run: |
          bun run verify:recipes
          bun run verify:recipe-production

      - name: Document sequence integrity validation
        run: bun run verify:number-sequences

      - name: Same-tab recovery backup validation
        run: bun run verify:recovery-backup

      - name: Production build
        run: bun run build
